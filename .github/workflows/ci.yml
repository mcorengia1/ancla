name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Logic tests
        run: npm test

      - name: Mozilla validator (web-ext lint)
        run: npm run lint -- --warnings-as-errors

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ancla-extension
          path: dist/*.zip
