<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desbloqueo - Ancla</title>
  <link rel="icon" href="icons/icon.svg">
  <style>
    :root {
      --bg: #f6f6f9; --card: #ffffff; --text: #1b1b22; --muted: #6b6b78; --line: #e4e4ea;
      --accent: #5b6cff; --accent-soft: #eceeff; --track: #e9e9f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131318; --card: #1c1c23; --text: #ececf1; --muted: #9a9aa8; --line: #2c2c36;
        --accent: #7c8aff; --accent-soft: #252848; --track: #2a2a34;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    main { width: min(460px, 100% - 32px); background: var(--card); border: 1px solid var(--line);
           border-radius: 20px; padding: 36px 32px; text-align: center; }
    img.logo { width: 56px; height: 56px; }
    h1 { font-size: 22px; font-weight: 650; margin: 16px 0 8px; letter-spacing: -.01em; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 6px; font-size: 14px; }
    .ring { position: relative; width: 190px; height: 190px; margin: 26px auto 18px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 10; }
    .ring .track { stroke: var(--track); }
    .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
    #timer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .badge { display: inline-block; padding: 5px 12px; border-radius: 999px; background: var(--accent-soft);
             color: var(--accent); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .question { font-style: italic; color: var(--text); opacity: .85; margin: 18px 0 22px; min-height: 22px; }
    button { width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: transparent;
             color: var(--text); cursor: pointer; font-size: 14px; font-weight: 600; }
    button:hover { background: var(--accent-soft); }
    .done #timer { font-size: 54px; }
  </style>
</head>
<body>
  <main id="main">
    <img class="logo" src="icons/icon.svg" alt="">
    <h1 id="title">Esperá un momento</h1>
    <p id="text">Dejá esta pestaña abierta. Si la cerrás, el desbloqueo se cancela.</p>
    <span class="badge" id="badge" hidden></span>
    <div class="ring">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="44"/>
        <circle class="bar" id="bar" cx="50" cy="50" r="44"/>
      </svg>
      <div id="timer">--:--</div>
    </div>
    <p class="question" id="question">¿Qué ibas a hacer cuando abriste esto?</p>
    <button id="cancel">Me arrepentí, volver a trabajar</button>
  </main>
  <script src="common.js"></script>
  <script src="unlock.js"></script>
</body>
</html>
