name: "Bug report · Reportar un error"
description: "Something doesn't work as expected. · Algo no funciona como debería."
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened · Qué pasó"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What you expected · Qué esperabas"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce · Pasos para reproducirlo"
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: setup
    attributes:
      label: "Your profiles · Tus perfiles"
      description: "Which profiles were active, their schedules and whether strict mode was on. · Qué perfiles estaban activos, sus horarios y si el modo estricto estaba encendido."
  - type: input
    id: versions
    attributes:
      label: "Ancla and Firefox versions · Versiones de Ancla y Firefox"
      placeholder: "Ancla 2.2, Firefox 144, Windows 11"
    validations:
      required: true
